[project]
name = "sarathi"
version = "0.1.0"
description = "Sarathi backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "psycopg[binary]",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "PyJWT[crypto]",
    "httpx",
    "structlog",
    "google-genai",
    "email-validator>=2.3.0",
    "pyyaml>=6.0.3",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "black",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
