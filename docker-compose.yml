
services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=sarathi
      - POSTGRES_PASSWORD=sarathi
      - POSTGRES_DB=sarathi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sarathi -d sarathi"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://sarathi:sarathi@postgres:5432/sarathi
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
