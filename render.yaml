services:
  - type: web
    name: sarthi-backend
    env: docker
    region: frankfurt
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENV
        sync: false
      - key: AUTH_MODE
        sync: false
      - key: DEMO_MODE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
