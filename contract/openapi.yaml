components:
  schemas:
    Accessibility:
      properties:
        font_scale:
          type: number
          maximum: 2.0
          minimum: 1.0
          title: Font Scale
          default: 1.0
        reduced_motion:
          type: boolean
          title: Reduced Motion
          default: false
        screen_reader:
          type: boolean
          title: Screen Reader
          default: false
        dyslexia_font:
          type: boolean
          title: Dyslexia Font
          default: false
      type: object
      title: Accessibility
    AdaptationAction:
      type: string
      enum:
      - insert_prerequisite
      - slow_pace
      - reexplain_concept
      - compress_forward
      - reorder
      - extend_timeline
      - no_op
      title: AdaptationAction
    AdaptationEventResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        plan_id:
          type: string
          format: uuid
          title: Plan Id
        trigger:
          $ref: '#/components/schemas/AdaptationTrigger'
        action:
          $ref: '#/components/schemas/AdaptationAction'
        reason:
          type: string
          title: Reason
        timeline_impact:
          type: string
          title: Timeline Impact
        before:
          additionalProperties: true
          type: object
          title: Before
        after:
          additionalProperties: true
          type: object
          title: After
        accepted:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Accepted
      type: object
      required:
      - id
      - created_at
      - plan_id
      - trigger
      - action
      - reason
      - timeline_impact
      - before
      - after
      - accepted
      title: AdaptationEventResponse
    AdaptationListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdaptationEventResponse'
          type: array
          title: Items
        total:
          type: integer
          title: Total
      type: object
      required:
      - items
      - total
      title: AdaptationListResponse
    AdaptationRespondRequest:
      properties:
        accepted:
          type: boolean
          title: Accepted
      type: object
      required:
      - accepted
      title: AdaptationRespondRequest
    AdaptationTrigger:
      type: string
      enum:
      - struggling
      - stuck
      - racing
      - stalled
      - decaying
      title: AdaptationTrigger
    CheckpointAttemptResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        score:
          type: number
          title: Score
        mastery_deltas:
          items:
            $ref: '#/components/schemas/MasteryDelta'
          type: array
          title: Mastery Deltas
        feedback:
          items:
            $ref: '#/components/schemas/ItemFeedback'
          type: array
          title: Feedback
        submitted_at:
          type: string
          format: date-time
          title: Submitted At
      type: object
      required:
      - id
      - score
      - mastery_deltas
      - feedback
      - submitted_at
      title: CheckpointAttemptResponse
    CheckpointItem:
      properties:
        id:
          type: string
          title: Id
        type:
          type: string
          title: Type
        question:
          type: string
          title: Question
        options:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Options
        concept_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Concept Ids
      type: object
      required:
      - id
      - type
      - question
      - concept_ids
      title: CheckpointItem
    CheckpointResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
