openapi: 3.1.0
info:
  title: Sarathi API
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/usage:
    get:
      tags:
      - Health
      summary: Get Usage
      operationId: get_usage_health_usage_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
  /api/v1/lessons/{lesson_id}/checkpoint:
    post:
      tags:
      - Checkpoints
      summary: Generate Checkpoint
      operationId: generate_checkpoint_api_v1_lessons__lesson_id__checkpoint_post
      security:
      - HTTPBearer: []
      parameters:
